<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pesquisa de Perfil dos Profissionais — Madeira Serviços</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --orange:#EA5B0C; --orange-light:#FEF0E7; --dark:#1A1A2E; --muted:#7A7A8A;
  --border:#EDE8E2; --white:#FFFFFF; --bg:#FAF7F4; --erro:#C0262D;
  --shadow:0 2px 12px rgba(234,91,12,.10);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--dark)}
.shell{display:flex;flex-direction:column;width:100%;max-width:480px;margin:0 auto;height:100%;background:var(--bg)}

.hdr{flex-shrink:0;background:#fff;border-bottom:3px solid var(--orange);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;box-shadow:var(--shadow);z-index:2}
.hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo{background:var(--orange);color:#fff;border-radius:6px;padding:4px 8px;font-weight:800;font-size:13px;line-height:1.1;letter-spacing:-.01em}
.logo small{display:block;font-weight:600;font-size:9px;opacity:.9;letter-spacing:.04em;text-transform:uppercase}
.status{font-size:12px;color:#2E8B3E;font-weight:700;margin-left:auto}
.status::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#43A047;margin-right:5px;vertical-align:1px}
.prog{display:flex;align-items:center;gap:8px}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:0;background:var(--orange);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.prog-lbl{font-size:12px;color:var(--muted);font-weight:700;min-width:42px;text-align:right}

.chat{flex:1;overflow-y:auto;padding:16px 14px 20px;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.row{display:flex;margin-bottom:4px;animation:up .28s ease both}
.row.bot{justify-content:flex-start}
.row.user{justify-content:flex-end;margin:6px 0 12px}
.row.sec{justify-content:center;margin:14px 0 8px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bbl{max-width:84%;padding:10px 14px;font-size:15px;line-height:1.5;border-radius:18px;word-break:break-word}
.bbl.bot{background:#fff;border-bottom-left-radius:4px;box-shadow:var(--shadow)}
.bbl.bot .ajuda{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.bbl.user{background:var(--orange);color:#fff;border-bottom-right-radius:4px}
.sec-tag{background:var(--orange-light);color:var(--orange);font-weight:800;font-size:12px;padding:5px 12px;border-radius:99px;text-align:center}
.typing{display:flex;gap:4px;align-items:center;padding:13px 16px}
.dot{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}

.inp{flex-shrink:0;background:var(--bg);border-top:1px solid var(--border);padding:10px 14px max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;box-shadow:0 -4px 16px rgba(0,0,0,.06);max-height:55%;overflow-y:auto}
.inp:empty{display:none}
.dica{font-size:12px;color:var(--muted);font-weight:700}
.dica.erro{color:var(--erro)}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 13px;font-family:inherit;font-weight:600;font-size:14px;line-height:1.3;color:var(--dark);text-align:left;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--orange)}
.opt.sel{background:var(--orange);color:#fff;border-color:var(--orange)}
.opt .rk{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:99px;background:#fff;color:var(--orange);font-weight:800;font-size:12px;margin-right:6px}
.opt.pular{background:transparent;color:var(--muted);box-shadow:none;border-style:dashed}
.acoes{display:flex;gap:8px}
.cfm{flex:1;background:var(--orange);color:#fff;border:none;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 12px rgba(234,91,12,.25)}
.cfm:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.txt-row{display:flex;gap:8px;align-items:flex-end}
.txt-in{flex:1;border:1.5px solid var(--border);border-radius:16px;padding:10px 14px;font-family:inherit;font-size:16px;line-height:1.4;resize:none;min-height:44px;max-height:100px;outline:none;background:#fff;color:var(--dark)}
.txt-in:focus{border-color:var(--orange)}
.send{width:44px;height:44px;border-radius:50%;background:var(--orange);border:none;cursor:pointer;display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 12px rgba(234,91,12,.3)}
.send svg{width:18px;height:18px;fill:#fff}
.scl-nums{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.scl-btn{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:10px 0;font-family:inherit;font-weight:800;font-size:14px;color:var(--dark);cursor:pointer}
.scl-btn:hover{border-color:var(--orange)}
.scl-lbls{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.end-card{background:#fff;border-radius:20px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);margin:12px 0;animation:up .5s ease both}
.end-card .selo{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.end-card .selo::after{content:"";width:16px;height:28px;border:solid #fff;border-width:0 5px 5px 0;transform:translateY(-3px) rotate(45deg)}
.end-card h2{font-size:20px;font-weight:800;margin-bottom:8px}
.end-card p{font-size:14px;color:var(--muted);line-height:1.6}
.aviso{background:var(--orange-light);border:1px solid var(--orange);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.row,.end-card{animation:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="hdr">
    <div class="hdr-top">
      <div class="logo">Madeira<small>Serviços</small></div>
      <div class="status">online</div>
    </div>
    <div class="prog"><div class="prog-bar"><div class="prog-fill" id="pf"></div></div><div class="prog-lbl" id="pl"></div></div>
  </header>
  <main class="chat" id="chat" aria-live="polite"></main>
  <div class="inp" id="inp"></div>
</div>

<script>
/* ============ CONFIGURAÇÃO ============ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwbBrVkpjNnxcjdF0pR218bwZHqLpy7fVDZqoRmFgvpxK_2n2zKH32JjnRqeHyXB6fc/exec";
const MARCA = "Madeira Serviços";
const VERSAO = "2026-10-14.3";   // v3: sem "(marque todas)", sem P28 e P40
const FORMATO = "chat";
/* ====================================== */
const M = s => s.replace(/\{M\}/g, MARCA);
const OPC = "Opcional. Escreva do seu jeito, pode ser curto.";

const SECOES = [
  { letra:"", titulo:"Pesquisa de Perfil dos Profissionais", desc:"",
    intro:[
      "Oi! Aqui é o time da Madeira Serviços. Estamos planejando as próximas mudanças da plataforma, como benefícios, distribuição de serviços e melhorias no app, e queremos fazer isso com base na experiência de quem faz o trabalho acontecer: você. Leva cerca de 15 minutos, quase tudo de marcar. Fique tranquilo:",
      "✔ Não existe resposta certa ou errada. Queremos sua opinião sincera.\n✔ Suas respostas não mudam sua nota nem os serviços que você recebe.\n✔ Os dados são confidenciais (LGPD) e nunca serão usados para avaliar você individualmente.",
      "Depois da pesquisa, vamos contar para todos os profissionais o que descobrimos e o que vamos mudar."
    ],
    qs:[
      {id:"P0a", n:"", text:"Código do profissional", type:"code", req:true,
        help:"Digite o seu código de profissional."},
      {id:"P0b", n:"", text:"Você concorda em participar desta pesquisa e que suas respostas sejam usadas de forma agrupada para melhorar a plataforma?",
        type:"single", req:true, options:["Sim, concordo","Não concordo"]}
    ]},
  { letra:"A", titulo:"Quem é você e como aprendeu", desc:"Sobre sua trajetória no ofício.", qs:[
      {id:"P01", n:1, text:"Qual sua faixa de idade?", type:"single", req:true, options:["18–24","25–34","35–44","45–54","55+"]},
      {id:"P02", n:2, text:"Há quanto tempo você trabalha com montagem de móveis?", type:"single", req:true,
        options:["Menos de 1 ano","1–3 anos","3–5 anos","5–10 anos","Mais de 10 anos"]},
      {id:"P03", n:3, text:"Como você aprendeu o ofício?", type:"multi", req:true, other:true,
        options:["Sozinho, na prática","Vídeos na internet","Com familiar ou amigo","Como ajudante de outro montador","Trabalhando em loja, fábrica ou marcenaria","Curso (SENAI, Sebrae, outro)"]},
      {id:"P04", n:4, text:"Além de montagem, quais serviços você sabe fazer bem?", type:"multi", req:true, other:true,
        options:["Desmontagem","Instalação de painéis e suportes de TV","Prateleiras e fixação em parede","Cortinas e persianas","Elétrica","Hidráulica","Marcenaria e ajustes","Limpeza ou impermeabilização de estofados","Nenhum além de montagem"],
        excl:["Nenhum além de montagem"]},
      {id:"P05", n:5, text:"Existe algum móvel que você não monta ou prefere evitar?", type:"multi", req:true, other:true,
        options:["Painel","Cama box baú","Mesa","Cozinha modulada","Guarda-roupa grande","Home office com gaveteiro","Monto todos"],
        excl:["Monto todos"]},
      {id:"P06", n:6, text:"Você já fez algum curso de segurança no trabalho (uso de EPI, trabalho em altura, fixação em parede)?", type:"single", req:true,
        options:["Sim","Não","Não, mas gostaria"]},
      {id:"P07", n:7, text:"Em quais temas você gostaria de receber treinamento?", type:"multi", req:true,
        options:["Móveis complexos (cozinha, painel)","Fixação em drywall e porcelanato","Segurança e EPI","Atendimento ao cliente","Uso do app","Gestão do próprio negócio e precificação","Elétrica ou hidráulica","Não tenho interesse"],
        excl:["Não tenho interesse"]}
    ]},
  { letra:"B", titulo:"Sua rotina e outras fontes de trabalho", desc:"Sobre como você organiza sua semana.", qs:[
      {id:"P08", n:8, text:"A montagem é sua principal fonte de renda?", type:"single", req:true,
        options:["É a única","É a principal, mas tenho outras","É um complemento"]},
      {id:"P09", n:9, text:"Além da {M}, onde você pega trabalho hoje?", type:"multi", req:true, other:true,
        options:["Clientes particulares e indicação","Lojas de móveis ou varejistas","Empresas terceirizadas de montagem","Outros apps de serviço (ex.: GetNinjas)","Apps de transporte ou entrega (Uber, 99, iFood)","Emprego com carteira assinada","Nenhum, só a {M}"],
        excl:["Nenhum, só a {M}"]},
      {id:"P10", n:10, text:"Do total de serviços que você faz no mês, quanto vem da {M}?", type:"single", req:true,
        options:["Quase tudo (80% ou mais)","Mais da metade","Cerca de metade","Menos da metade","Muito pouco"]},
      {id:"P11", n:11, text:"Quantos dias por semana você costuma trabalhar com montagem?", type:"single", req:true, options:["1–2","3–4","5","6–7"]},
      {id:"P12", n:12, text:"Em quais dias e períodos você prefere pegar serviços?", type:"multi", req:true,
        options:["Dias úteis de manhã","Dias úteis à tarde","Sábado","Domingo e feriado"]},
      {id:"P13", n:13, text:"No fim do ano a demanda aumenta. Você teria interesse em pegar serviços:", type:"multi", req:true,
        options:["Aos domingos","Em feriados","À noite, até 20h","Não tenho interesse"], excl:["Não tenho interesse"]},
      {id:"P14", n:14, text:"Num dia bom, quantos serviços de montagem você consegue fazer?", type:"single", req:true, options:["1","2","3","4","5 ou mais"]},
      {id:"P15", n:15, text:"Hoje, a plataforma oferece volume de serviços suficiente para você?", type:"single", req:true,
        options:["Mais do que consigo fazer","Suficiente","Menos do que eu gostaria","Muito menos"]},
      {id:"P16", n:16, text:"Quando você recusa ou deixa passar um serviço da {M}, qual o principal motivo? (até 3)", type:"multi", req:true, other:true, max:3, shuffle:true,
        options:["Longe demais","Valor baixo","Horário não encaixa","Móvel complexo demais","Já tenho agenda em outro lugar","Não vi a oferta a tempo","Falta ferramenta ou ajudante"]},
      {id:"P17", n:17, text:"Se a {M} garantisse um volume mínimo de serviços por semana perto de você, você trabalharia só ou principalmente com a {M}?", type:"single", req:true,
        options:["Sim","Talvez, dependendo do valor","Não"]}
    ]},
  { letra:"C", titulo:"Deslocamento", desc:"Sobre como você chega até os serviços.", qs:[
      {id:"P18", n:18, text:"Como você se desloca até os serviços? (principal)", type:"single", req:true, other:true,
        options:["Carro","Moto","Ônibus ou metrô","Bicicleta","Carona ou o ajudante leva"]},
      {id:"P19", n:19, text:"O veículo que você usa é:", type:"single", req:true,
        options:["Próprio e quitado","Próprio e financiado","Alugado","Emprestado","Não uso veículo"]},
      {id:"P20", n:20, text:"Você mora na mesma cidade onde faz a maior parte dos serviços?", type:"single", req:true,
        options:["Sim","Não, em cidade vizinha","Não, a mais de 50 km"]},
      {id:"P21", n:21, text:"Qual a distância máxima que você considera ideal para aceitar um serviço?", type:"single", req:true,
        options:["Até 5 km","5–10 km","10–20 km","20–40 km","Mais de 40 km"]},
      {id:"P22", n:22, text:"Quanto você gasta por dia com deslocamento (combustível, passagem, estacionamento)?", type:"single", req:true,
        options:["Até R$ 20","R$ 20–50","R$ 50–100","Mais de R$ 100"]},
      {id:"P23", n:23, text:"Nos últimos 3 meses, quantas vezes você atrasou ou faltou a um serviço por problema de transporte ou distância?", type:"single", req:true,
        options:["Nenhuma","1–2","3–5","Mais de 5"]}
    ]},
  { letra:"D", titulo:"Ferramentas e forma de trabalho", desc:"Sobre o que você leva para o serviço.", qs:[
      {id:"P24", n:24, text:"Quais ferramentas te acompanham no dia a dia?", type:"multi", req:true, other:true,
        options:["Parafusadeira","Furadeira de impacto","Nível a laser","Detector de cano e fiação","Escada","Serra ou tico-tico","Kit de brocas para alvenaria e porcelanato","Suporte telescópico (terceira mão)","Sargento angular ou equivalente","Aspirador portátil"]},
      {id:"P25", n:25, text:"Você leva materiais de reposição para os serviços?", type:"multi", req:true,
        options:["Buchas e parafusos extras, inclusive para drywall","Massa ou caneta para retoque de riscos","Cola","Dobradiças ou corrediças","Não levo"], excl:["Não levo"]},
      {id:"P26", n:26, text:"Quais EPIs você usa nos serviços?", type:"multi", req:true,
        options:["Óculos","Luvas","Protetor auricular","Calçado de segurança","Nenhum"], excl:["Nenhum"]},
      {id:"P27", n:27, text:"Você trabalha com ajudante?", type:"single", req:true,
        options:["Sempre","Só em serviços grandes, quando consigo","Nunca, trabalho sozinho"]},
      {id:"P29a", n:"29a", text:"Qual celular você usa no trabalho?", type:"single", req:true, options:["Android","iPhone"]},
      {id:"P29b", n:"29b", text:"Qual o seu plano de internet no celular?", type:"single", req:true, options:["Pré-pago","Controle","Pós-pago","Uso só Wi-Fi"]}
    ]},
  { letra:"E", titulo:"Ganhos", desc:"Perguntas opcionais, em faixas. Responda só se se sentir à vontade.", qs:[
      {id:"P30", n:30, text:"Quanto você ganha por mês, em média, somando todos os serviços de montagem?", type:"single", req:false,
        options:["Até R$ 2 mil","R$ 2–4 mil","R$ 4–6 mil","R$ 6–9 mil","Mais de R$ 9 mil","Prefiro não dizer"]},
      {id:"P31", n:31, text:"Quanto você precisa ganhar num dia para valer a pena sair de casa?", type:"single", req:false,
        options:["Até R$ 150","R$ 150–250","R$ 250–400","Mais de R$ 400"]},
      {id:"P32", n:32, text:"Se houvesse serviço sobrando na plataforma, quanto você gostaria de ganhar por dia?", type:"single", req:false,
        options:["Até R$ 250","R$ 250–400","R$ 400–600","Mais de R$ 600"]},
      {id:"P33", n:33, text:"Comparando com suas outras fontes, a {M} paga:", type:"single", req:false,
        options:["Melhor","Igual","Pior","Só trabalho com a {M}"]},
      {id:"P34", n:34, text:"Receber mais rápido mudaria quanto você trabalha com a {M}?", type:"single", req:false,
        options:["Muito","Um pouco","Não mudaria"]}
    ]},
  { letra:"F", titulo:"Sua experiência com a {M}", desc:"Seja sincero: é assim que a gente melhora.", qs:[
      {id:"P35", n:35, text:"De 0 a 10, quanto você recomendaria a {M} para outro montador trabalhar?", type:"scale", req:true,
        min:0, max:10, lo:"Não recomendaria", hi:"Recomendaria muito"},
      {id:"P36", n:36, text:"Quais são as maiores dificuldades de trabalhar com a {M}? (até 3)", type:"multi", req:true, max:3, shuffle:true,
        options:["Valor do serviço","Distância entre serviços","Poucos serviços perto de mim","App difícil ou instável","Suporte demora a responder","Cliente ausente ou endereço errado","Peça faltando ou produto avariado","Prazo de pagamento","Regras e punições pouco claras"]},
      {id:"P37", n:37, text:"Com que frequência você encontra peça faltando ou produto avariado?", type:"single", req:true,
        options:["Quase nunca","1 a cada 10 serviços","1 a cada 5 serviços","Mais que isso"]},
      {id:"P38", n:38, text:"Qual parte do app mais atrapalha seu dia? (até 2)", type:"multi", req:true, max:2, shuffle:true,
        options:["Aceitar serviço","Agenda","Rota e endereço","Chat com o cliente","Fotos e finalização","Extrato e pagamento","Nenhuma"], excl:["Nenhuma"]},
      {id:"P39", n:39, text:"O que você ainda precisa pedir ao suporte e gostaria de resolver sozinho no app?", type:"text", req:false, help:OPC},
    ]},
  { letra:"G", titulo:"Benefícios e futuro", desc:"Últimas perguntas!", qs:[
      {id:"P41", n:41, text:"Escolha os 3 benefícios que mais fariam diferença para você", type:"grid", req:false, shuffle:true,
        help:"Marque 1º, 2º e 3º lugar. Os demais ficam em branco.", cols:["1º","2º","3º"],
        rows:["Antecipação de pagamento","Prioridade para escolher serviços","Agenda com serviços agrupados perto","Plano de saúde","Seguro contra acidentes","Crédito para ferramentas ou veículo","Desconto em combustível ou assistência veicular","Cursos e certificação","Kit de EPI"]},
      {id:"P42", n:42, text:"Nos próximos 12 meses, você pretende:", type:"single", req:true,
        options:["Trabalhar mais com montagem","Manter como está","Montar equipe ou empresa","Diminuir ou mudar de área"]},
      {id:"P43", n:43, text:"O que faria você deixar de trabalhar com a {M}?", type:"text", req:false, help:OPC},
      {id:"P44", n:44, text:"Se você fosse o dono da {M}, o que mudaria primeiro?", type:"text", req:false, help:OPC},
      {id:"P45", n:45, text:"Você usaria o colete durante os serviços?", type:"single", req:true,
        help:"Estamos preparando um colete de identificação da {M} para os profissionais. Com ele, o cliente reconhece na hora quem está chegando para o serviço, o que dá mais segurança e confiança para os dois lados: para o cliente, na hora de abrir a porta, e para você, que chega identificado e é recebido com mais tranquilidade. É leve e vai por cima da sua roupa.",
        options:["Sim, usaria sempre","Usaria na maioria dos serviços","Usaria, mas preferia não","Não usaria"]}
    ]},
  { letra:"", titulo:"Colete", desc:"", cond: R => ["Usaria, mas preferia não","Não usaria"].includes(R.P45), qs:[
      {id:"P46", n:46, text:"O que poderia dificultar o uso do colete no dia a dia?", type:"multi", req:true, other:true, shuffle:true,
        options:["Calor","Atrapalha para trabalhar (abaixar, carregar peças)","Também trabalho para outras empresas ou plataformas","Esquecer de levar","Não gosto da aparência"]}
    ]},
  { letra:"", titulo:"Tamanho", desc:"", qs:[
      {id:"P47", n:47, text:"Qual tamanho de camiseta você usa?", type:"single", req:true, help:"Usaremos para enviar o colete no tamanho certo.",
        options:["P","M","G","GG","XG"]}
    ]}
];

/* ---------- roteiro: mesmas perguntas e textos da versão em lista ---------- */
const intro = SECOES[0];
const QS = SECOES.flatMap(s => s.qs);
const P0a = QS.find(q=>q.id==="P0a"), P0b = QS.find(q=>q.id==="P0b");
const PASSOS = [];
intro.intro.forEach(t => PASSOS.push({msg:t}));
PASSOS.push({q:P0b});            // consentimento antes do código: quem recusa sai sem informar nada
PASSOS.push({q:P0a});
SECOES.slice(1).forEach(s => {
  if (s.letra) PASSOS.push({sec:`Bloco ${s.letra} · ${M(s.titulo)}`});   // Colete e Tamanho não têm bloco nem descrição
  if (s.desc) PASSOS.push({msg:M(s.desc)});
  s.qs.forEach(q => PASSOS.push({q, cond:s.cond}));
});
const ativa = q => { const s = SECOES.find(x => x.qs.includes(q)); return !s.cond || s.cond(R); };
const TOTAL_Q = PASSOS.filter(p=>p.q).length;

/* ---------- estado ---------- */
const CHAVE = "pesq-pros-chat-" + VERSAO;
let R = {}, ORDEM = {}, pos = 0, perguntado = -1, hist = [], inicio = Date.now(), enviado = false;
try { const s = JSON.parse(localStorage.getItem(CHAVE)||"null"); if (s){ ({R,ORDEM,pos,perguntado,hist,inicio,enviado} = Object.assign({R:{},ORDEM:{},pos:0,perguntado:-1,hist:[],inicio:Date.now(),enviado:false}, s)); } } catch(e){}
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify({R,ORDEM,pos,perguntado,hist,inicio,enviado})); } catch(e){} }

const chat = document.getElementById("chat"), inp = document.getElementById("inp");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const espera = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
const rolar = () => chat.scrollTop = chat.scrollHeight;
new ResizeObserver(rolar).observe(inp);  // o painel de respostas cresce e empurra a conversa; mantém a última pergunta visível

function embaralhar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function opcoesDe(q){
  const base = (q.type==="grid" ? q.rows : q.options).map(M);
  if (!q.shuffle) return base;
  if (!ORDEM[q.id]){ const fx=(q.excl||[]).map(M); ORDEM[q.id]=embaralhar(base.filter(o=>!fx.includes(o))).concat(fx); }
  return ORDEM[q.id];
}

function bolha(tipo, html, registrar=true){
  const r = document.createElement("div");
  if (tipo==="sec"){ r.className="row sec"; r.innerHTML=`<div class="sec-tag">${html}</div>`; }
  else { r.className="row "+tipo; r.innerHTML=`<div class="bbl ${tipo}">${html}</div>`; }
  chat.appendChild(r); rolar();
  if (registrar){ hist.push([tipo, html]); salvar(); }
}
async function botDiz(html, tipo="bot"){
  const t = document.createElement("div"); t.className="row bot";
  t.innerHTML = `<div class="bbl bot typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  chat.appendChild(t); rolar();
  await espera(Math.min(450 + html.length*6, 1100));
  t.remove(); bolha(tipo, html);
}
function progresso(){
  const feitas = PASSOS.slice(0,pos).filter(p=>p.q).length;
  document.getElementById("pf").style.width = (feitas/TOTAL_Q*100)+"%";
  document.getElementById("pl").textContent = `${feitas}/${TOTAL_Q}`;
}
function textoPergunta(q){
  let ajuda = q.help ? M(q.help) : "";
  if (q.max) ajuda = (ajuda ? ajuda+" " : "") + `Escolha até ${q.max}.`;
  if (q.type==="multi" && !q.max) ajuda = ajuda || "Pode marcar mais de uma.";
  return esc(M(q.text)) + (ajuda ? `<span class="ajuda">${esc(ajuda)}</span>` : "");
}

/* ---------- entradas ---------- */
const SVG_SEND = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>`;
function perguntar(q){
  return new Promise(res => {
    const pular = !q.req ? `<button class="opt pular" data-pular>Prefiro pular</button>` : "";
    const dica = t => `<div class="dica" id="dica">${t}</div>`;

    if (q.type==="code"){
      inp.innerHTML = dica("Digite e toque em enviar") + `<div class="txt-row"><input class="txt-in" id="ti" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código do profissional"><button class="send" id="sd" aria-label="Enviar">${SVG_SEND}</button></div>`;
      const ti = document.getElementById("ti"); ti.focus();
      const ir = () => { const v = ti.value.trim(); if (!v){ erro("Digite o seu código de profissional."); return; } res({v, show:v}); };
      document.getElementById("sd").onclick = ir; ti.onkeydown = e => { if (e.key==="Enter") ir(); };
      return;
    }
    if (q.type==="text"){
      inp.innerHTML = `<div class="txt-row"><textarea class="txt-in" id="ti" rows="1" aria-label="${esc(M(q.text))}"></textarea><button class="send" id="sd" aria-label="Enviar">${SVG_SEND}</button></div><div class="opts">${pular}</div>`;
      const ti = document.getElementById("ti");
      document.getElementById("sd").onclick = () => { const v=ti.value.trim(); if(!v){ res({v:"", show:"Prefiro pular"}); return;} res({v, show:v}); };
      inp.querySelector("[data-pular]").onclick = () => res({v:"", show:"Prefiro pular"});
      return;
    }
    if (q.type==="scale"){
      let b=""; for(let i=q.min;i<=q.max;i++) b+=`<button class="scl-btn" data-v="${i}">${i}</button>`;
      inp.innerHTML = `<div><div class="scl-nums">${b}</div><div class="scl-lbls"><span>0 = ${esc(q.lo)}</span><span>10 = ${esc(q.hi)}</span></div></div>`;
      inp.querySelectorAll(".scl-btn").forEach(x => x.onclick = () => res({v:Number(x.dataset.v), show:x.dataset.v}));
      return;
    }
    if (q.type==="grid"){
      let ord = [];
      const desenhar = () => {
        inp.innerHTML = dica(ord.length<3 ? `Toque no que seria o seu ${ord.length+1}º lugar` : "Pronto! Confirme ou toque para trocar") +
          `<div class="opts">` + opcoesDe(q).map(o => { const i=ord.indexOf(o); return `<button class="opt ${i>=0?"sel":""}" data-v="${esc(o)}">${i>=0?`<span class="rk">${i+1}º</span>`:""}${esc(o)}</button>`; }).join("") + `</div>` +
          `<div class="acoes"><button class="cfm" id="cf" ${ord.length?"":"disabled"}>Confirmar</button></div><div class="opts">${pular}</div>`;
        inp.querySelectorAll(".opt[data-v]").forEach(x => x.onclick = () => {
          const v=x.dataset.v, i=ord.indexOf(v);
          if (i>=0) ord.splice(i,1); else if (ord.length<3) ord.push(v);
          desenhar();
        });
        document.getElementById("cf").onclick = () => { const g={}; ord.forEach((o,i)=>g[q.cols[i]]=o); res({v:g, show: ord.map((o,i)=>`${i+1}º ${o}`).join(" · ")}); };
        inp.querySelector("[data-pular]").onclick = () => res({v:{}, show:"Prefiro pular"});
      };
      desenhar(); return;
    }
    // single / multi
    const ops = opcoesDe(q).concat(q.other ? ["Outro"] : []);
    const excl = (q.excl||[]).map(M);
    let sel = [];
    const desenhar = (msg) => {
      const multi = q.type==="multi";
      const outroOn = sel.includes("Outro");
      inp.innerHTML = (multi ? dica(msg || (q.max ? `${sel.length} de ${q.max} escolhidas` : "Toque em todas que valem e confirme")) : (msg?dica(msg):"")) +
        `<div class="opts">` + ops.map(o => `<button class="opt ${sel.includes(o)?"sel":""}" data-v="${esc(o)}" aria-pressed="${sel.includes(o)}">${esc(o)}</button>`).join("") + `</div>` +
        (outroOn ? `<div class="txt-row"><input class="txt-in" id="ot" placeholder="Qual?" aria-label="Descreva a opção Outro" value="${esc(R[q.id+"_outro"]||"")}">${multi?"":`<button class="send" id="sd" aria-label="Enviar">${SVG_SEND}</button>`}</div>` : "") +
        (multi ? `<div class="acoes"><button class="cfm" id="cf" ${sel.length?"":"disabled"}>Confirmar</button></div>` : "") +
        (pular ? `<div class="opts">${pular}</div>` : "");
      if (msg) document.getElementById("dica").classList.add("erro");
      const ot = document.getElementById("ot");
      if (ot){ ot.oninput = () => { R[q.id+"_outro"] = ot.value; }; if (!msg) ot.focus(); }
      const fim = () => {
        const outro = (R[q.id+"_outro"]||"").trim();
        if (sel.includes("Outro") && !outro) return desenhar("Escreva qual é a opção Outro.");
        if (!sel.includes("Outro")) delete R[q.id+"_outro"];
        const show = sel.map(s => s==="Outro" ? `Outro: ${outro}` : s).join(", ");
        res({v: multi ? sel.slice() : sel[0], show});
      };
      inp.querySelectorAll(".opt[data-v]").forEach(x => x.onclick = () => {
        const v = x.dataset.v;
        if (!multi){ sel=[v]; if (v==="Outro") return desenhar(); return fim(); }
        if (sel.includes(v)) sel = sel.filter(s=>s!==v);
        else if (excl.includes(v)) sel = [v];
        else { sel = sel.filter(s=>!excl.includes(s)); if (q.max && sel.length>=q.max) return desenhar(`Você pode escolher até ${q.max}. Desmarque uma para trocar.`); sel.push(v); }
        desenhar();
      });
      const cf = document.getElementById("cf"); if (cf) cf.onclick = fim;
      const sd = document.getElementById("sd"); if (sd) sd.onclick = fim;
      if (ot && !multi) ot.onkeydown = e => { if (e.key==="Enter") fim(); };
      const pj = inp.querySelector("[data-pular]"); if (pj) pj.onclick = () => res({v: multi?[]:"", show:"Prefiro pular"});
    };
    desenhar();
  });
}
function erro(t){ const d=document.getElementById("dica"); if(d){ d.textContent=t; d.classList.add("erro"); } }

/* ---------- envio (mesmo formato de linha da versão em lista + formato e tempo) ---------- */
function montarLinha(parcial){
  const f = [["versao",VERSAO],["formato",FORMATO],["tempo_seg",Math.round((Date.now()-inicio)/1000)],["codigo",(R.P0a||"").trim()]];
  for (const q of QS){
    if (q.type==="code") continue;
    if (parcial && q.id!=="P0b") continue;
    const v = ativa(q) ? R[q.id] : undefined;
    if (q.type==="grid"){ q.cols.forEach((c,i)=>f.push([`${q.id}_${i+1}lugar`,(v||{})[c]||""])); continue; }
    f.push([q.id, Array.isArray(v) ? v.join("; ") : (v ?? "")]);
    if (q.other) f.push([q.id+"_outro", ativa(q) ? (R[q.id+"_outro"]||"") : ""]);
  }
  if (!parcial) f.push(["P47_colete", {P:"M",M:"G",G:"GG",GG:"XG",XG:"XGG"}[R.P47] || ""]);   // uso interno: colete = camiseta +1
  f.push(["user_agent", navigator.userAgent]);
  return f;
}
async function enviar(parcial){
  inp.innerHTML = `<div class="dica">Enviando…</div>`;
  const body = JSON.stringify({fields: montarLinha(parcial)});
  try {
    await fetch(ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
    enviado = true; salvar();
    inp.innerHTML = "";
    final(parcial ? "Tudo bem, respeitamos sua decisão. Nenhuma outra informação foi coletada." : "Suas respostas vão ajudar a construir uma plataforma melhor para você.", parcial ? "Obrigado!" : "Obrigado! 🧡");
  } catch(e){
    inp.innerHTML = `<div class="dica erro">Não foi possível enviar. Verifique sua internet. Suas respostas continuam salvas neste celular.</div><button class="cfm" id="rt">Tentar enviar de novo</button>`;
    document.getElementById("rt").onclick = () => enviar(parcial);
  }
}
function final(p, h){
  const d = document.createElement("div"); d.className = "end-card";
  d.innerHTML = `<div class="selo" aria-hidden="true"></div><h2>${esc(h)}</h2><p>${esc(p)}</p>`;
  chat.appendChild(d); rolar();
  document.getElementById("pf").style.width = "100%";
}

/* ---------- motor da conversa ---------- */
async function rodar(){
  hist.forEach(([t,h]) => bolha(t, h, false));   // retoma de onde parou
  if (enviado){ final("Recebemos suas respostas. Obrigado pela participação!", "Você já respondeu esta pesquisa"); return; }
  while (pos < PASSOS.length){
    progresso();
    const p = PASSOS[pos];
    if (p.cond && !p.cond(R)){ pos++; salvar(); continue; }   // pergunta condicional que não se aplica
    if (p.msg){ await botDiz(esc(p.msg).replace(/\n/g,"<br>")); pos++; salvar(); continue; }
    if (p.sec){ await espera(250); bolha("sec", esc(p.sec)); pos++; salvar(); continue; }
    const q = p.q;
    if (perguntado !== pos){ await botDiz(textoPergunta(q)); perguntado = pos; salvar(); }
    const r = await perguntar(q);
    inp.innerHTML = "";
    R[q.id] = r.v;
    bolha("user", esc(r.show));
    pos++; salvar();
    if (q.id==="P0b" && r.v==="Não concordo"){ progresso(); return enviar(true); }
  }
  progresso();
  await botDiz("Pronto, essas eram todas as perguntas. Enviando suas respostas…");
  enviar(false);
}
rodar();
</script>
